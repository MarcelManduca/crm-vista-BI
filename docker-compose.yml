version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dashboard_gralha_db
    environment:
      POSTGRES_USER: ${DB_USER:-gralha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gralha_password}
      POSTGRES_DB: ${DB_NAME:-dashboard_gralha}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gralha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dashboard_gralha_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard_gralha_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-gralha}:${DB_PASSWORD:-gralha_password}@db:5432/${DB_NAME:-dashboard_gralha}
      REDIS_URL: redis://redis:6379/0
      VISTA_API_BASE_URL: ${VISTA_API_BASE_URL}
      VISTA_API_KEY: ${VISTA_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dashboard_network

  # pgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dashboard_gralha_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gralha.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - dashboard_network

volumes:
  postgres_data:
  redis_data:

networks:
  dashboard_network:
    driver: bridge
